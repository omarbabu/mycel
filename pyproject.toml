[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycel"
version = "0.5.0"
description = "One global, founderless mesh for sharing GPU inference — with a premium chat app and an OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "cryptography>=48", "psutil>=5.9", "numpy>=1.26", "regex>=2023"]

[project.optional-dependencies]
probe = ["torch>=2.2"]
gpu = ["torch>=2.5"]   # GPU swarm stages (Metal / CUDA)
dev = ["pytest>=8"]

[project.scripts]
mycel = "mycel.cli:main"

[tool.setuptools.packages.find]
include = ["mycel*"]

[tool.setuptools.package-data]
mycel = ["static/**/*", "seeds.json"]
